<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Masi's Zim Trivia – Zimbabwe trivia by ExploreLocally</title>
<meta name="description" content="Cycle across Zimbabwe with Masi, the ExploreLocally tomato. Ten stops from Victoria Falls to the Matobo Hills, five questions and 60 seconds at each. How far can you ride?">
<link rel="canonical" href="https://zimtrivia.explorelocally.co.zw/">
<meta name="theme-color" content="#6DB8CE">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:site_name" content="ExploreLocally">
<meta property="og:title" content="Masi's Zim Trivia – how well do you know Zimbabwe?">
<meta property="og:description" content="Ten stops, five questions each, 60 seconds on the clock. Two wrong answers and the trip is over.">
<meta property="og:url" content="https://zimtrivia.explorelocally.co.zw/">
<meta property="og:image" content="https://zimtrivia.explorelocally.co.zw/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
[hidden]{display:none!important}
:root{
  --sky:#6DB8CE; --sky-deep:#4E9FB8; --navy:#1E3248; --navy-deep:#132234;
  --cream:#F7ECD4; --paper:#FFF8E8; --red:#E2482F; --yellow:#F6B531; --leaf:#4E9A3A; --leaf-lt:#7CC05A;
  --good:#3F8F3A; --good-bg:#CDEBB8; --bad:#C2361F; --bad-bg:#F9C7B9; --muted:#56657A;
  --display:"Lilita One","Arial Rounded MT Bold","Arial Black",sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100%;
  background:radial-gradient(120% 90% at 40% 20%,#8CCBDD 0%,var(--sky) 45%,var(--sky-deep) 100%) fixed;
  background-color:var(--sky);
  font-family:var(--body);color:var(--navy);padding-inline:16px;
}
.app{max-width:1140px;margin:0 auto;padding-block:16px 28px;display:grid;gap:14px}

/* HUD */
.hud{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:clamp(26px,4vw,36px);line-height:1;color:var(--cream);
  -webkit-text-stroke:0;text-shadow:0 3px 0 var(--navy),2px 0 0 var(--navy),-2px 0 0 var(--navy),0 -2px 0 var(--navy),2px 3px 0 var(--navy),-2px 3px 0 var(--navy);
  margin:0 auto 0 0;letter-spacing:.5px}
.chip{display:flex;align-items:center;gap:8px;background:var(--paper);border:3px solid var(--navy);border-radius:999px;
  padding:6px 14px 6px 12px;box-shadow:0 4px 0 var(--navy);font-weight:800;font-size:14px;position:relative}
.chip b{font-family:var(--display);font-weight:400;font-size:20px;font-variant-numeric:tabular-nums;line-height:1}
.chip span{text-transform:uppercase;letter-spacing:.08em;font-size:11px;color:var(--muted)}
.lives{display:flex;gap:4px}
.life{width:22px;height:22px;transition:transform .35s cubic-bezier(.34,1.56,.64,1),opacity .35s,filter .35s}
.life.lost{filter:grayscale(1);opacity:.3;transform:scale(.75) rotate(-20deg)}
.float{position:absolute;right:8px;top:-8px;font-family:var(--display);font-size:20px;color:var(--good);pointer-events:none;
  text-shadow:0 2px 0 var(--paper)}

/* layout */
.main{display:grid;gap:18px;align-items:start}
@media (min-width:900px){.main{grid-template-columns:minmax(0,1.3fr) minmax(340px,1fr)}}
.mapwrap{position:relative}
#map{width:100%;height:auto;display:block;overflow:visible}
.mapbtn,.mapcap,.mapclose{display:none}

/* ---------- phones & small tablets: questions first, map pops up ---------- */
@media (max-width:899px){
  .app{padding-block:12px 24px;gap:12px}
  .hud{display:grid;grid-template-columns:auto auto 1fr auto;align-items:center;gap:10px 8px}
  .brand{font-size:26px;grid-column:1/4;grid-row:1}
  .mapbtn{grid-column:4;grid-row:1}
  .hud .chip:not(.mapbtn){grid-row:2;justify-self:start}
  .hud .chip:nth-child(4){grid-column:3/5}
  .main{grid-template-columns:minmax(0,1fr)}
  .chip{padding:4px 10px 4px 9px;gap:6px;box-shadow:0 3px 0 var(--navy)}
  .chip b{font-size:17px}
  .chip span{font-size:10px}
  .chip.best{display:none}
  .life{width:19px;height:19px}
  .mapbtn{display:flex;cursor:pointer;font:inherit;color:var(--navy)}
  .mapbtn svg{width:18px;height:18px}
  .mapwrap{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));
    background:rgba(19,34,52,.62);opacity:0;visibility:hidden;transition:opacity .35s ease,visibility 0s linear .35s}
  .mapOpen .mapwrap{opacity:1;visibility:visible;transition:opacity .35s ease}
  .mapOpen{overflow:hidden}
  .mapcard{width:100%;max-width:560px;background:radial-gradient(120% 90% at 40% 20%,#8CCBDD 0%,var(--sky) 55%,var(--sky-deep) 100%);
    border:4px solid var(--navy);border-radius:24px;box-shadow:0 8px 0 var(--navy);padding:12px 10px 8px;
    transform:translateY(48px) scale(.94);transition:transform .5s cubic-bezier(.34,1.3,.64,1)}
  .mapOpen .mapcard{transform:none}
  .mapcap{display:block;margin:0 0 4px;text-align:center;font:400 22px/1.1 var(--display);color:var(--cream);
    text-shadow:0 2px 0 var(--navy),2px 0 0 var(--navy),-2px 0 0 var(--navy),0 -2px 0 var(--navy)}
  #map{max-height:calc(100dvh - 190px);margin:0 auto}
  .map-title{display:none}
  .mapclose{display:block;justify-self:center;align-self:center;width:auto}
  .panel{padding:18px 16px 20px;min-height:0;border-radius:20px;box-shadow:0 6px 0 var(--navy)}
  .scr{gap:12px}
  .lede{font-size:16px}
  .question{font-size:20px}
  .opt{min-height:54px;padding:10px 12px}
  .cta{justify-self:stretch;text-align:center;font-size:19px;padding:15px 20px}
  .fb .cta{width:100%}
  .actions .link-btn,.explore{flex:1 1 100%;justify-self:stretch}
  .stat b{font-size:22px}
}

/* panel */
.panel{background:var(--cream);border:4px solid var(--navy);border-radius:24px;box-shadow:0 8px 0 var(--navy);
  padding:22px 22px 24px;min-height:360px;position:relative}
.scr{display:grid;gap:14px;animation:scrIn .5s cubic-bezier(.34,1.3,.64,1) both}
@keyframes scrIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.eyebrow{font-weight:900;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
h1,h2{font-family:var(--display);font-weight:400;margin:0;line-height:1.05;text-wrap:balance}
h1{font-size:clamp(34px,4.5vw,46px)}
h2{font-size:clamp(28px,3.4vw,36px)}
.lede{margin:0;font-size:17px;line-height:1.5;max-width:40ch}
.rules{display:grid;gap:8px;margin:2px 0 4px;padding:0;list-style:none}
.rules li{display:flex;gap:10px;align-items:center;font-weight:700;font-size:15px}
.rules i{font-style:normal;flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  background:var(--paper);border:2.5px solid var(--navy);font-family:var(--display);font-size:15px}
.cta{justify-self:start;font:400 20px/1 var(--display);letter-spacing:.3px;color:var(--navy);background:var(--yellow);
  border:3px solid var(--navy);border-radius:999px;padding:14px 26px;cursor:pointer;box-shadow:0 5px 0 var(--navy);
  transition:transform .12s,box-shadow .12s}
.cta:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--navy)}
.cta:active{transform:translateY(4px);box-shadow:0 1px 0 var(--navy)}
button:focus-visible{outline:3px solid var(--red);outline-offset:3px}
.small{font-size:14px;color:var(--muted);font-weight:700;margin:0}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.link-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:800 15px/1.2 var(--body);color:var(--navy);
  background:var(--paper);border:3px solid var(--navy);border-radius:999px;padding:11px 18px;text-decoration:none;cursor:pointer;
  box-shadow:0 4px 0 var(--navy);transition:transform .12s,box-shadow .12s}
.link-btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--navy)}
.link-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--navy)}
.link-btn:focus-visible{outline:3px solid var(--red);outline-offset:3px}
.link-btn.wa{background:#CFF3D9}
.link-btn svg{width:18px;height:18px;flex:none}
.explore{justify-self:start}
.sharetext{width:100%;min-height:74px;font:600 14px/1.4 var(--body);color:var(--navy);background:var(--paper);border:2.5px solid var(--navy);border-radius:12px;padding:8px 10px;resize:none}

/* question */
.qtop{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.clock{font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums;line-height:1}
.clock.hot{color:var(--bad)}
.bar{height:12px;background:#E3D5B4;border:2.5px solid var(--navy);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--yellow);transform-origin:left;border-right:2.5px solid var(--navy)}
.bar.hot i{background:var(--red)}
.pips{display:flex;gap:6px}
.pip{width:26px;height:8px;border-radius:99px;background:#E3D5B4;border:2px solid var(--navy)}
.pip.ok{background:var(--leaf)}.pip.no{background:var(--red)}.pip.now{background:var(--paper);box-shadow:0 0 0 2px var(--yellow)}
.question{font-family:var(--body);font-weight:900;font-size:clamp(20px,2.3vw,24px);line-height:1.3;margin:2px 0 0;text-wrap:pretty}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:800 16px/1.3 var(--body);color:var(--navy);
  background:var(--paper);border:3px solid var(--navy);border-radius:16px;padding:11px 14px;cursor:pointer;
  box-shadow:0 4px 0 var(--navy);transition:transform .12s,box-shadow .12s,background .2s}
.opt:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 0 var(--navy)}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--navy)}
.opt:disabled{cursor:default}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--cream);
  border:2.5px solid var(--navy);font:400 15px/1 var(--display)}
.opt.right{background:var(--good-bg);border-color:var(--good);box-shadow:0 4px 0 var(--good)}
.opt.right .k{background:var(--good);color:#fff;border-color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);box-shadow:0 4px 0 var(--bad);animation:shake .45s}
.opt.wrong .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.dim{opacity:.5}
.optrow{position:relative}
.optrow.hasSrc .opt{padding-right:104px}
.srcbtn{position:absolute;right:12px;top:50%;transform:translateY(-50%);font:900 12px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;
  color:var(--good);background:var(--paper);border:2.5px solid var(--good);border-radius:999px;padding:8px 11px;cursor:pointer;
  animation:srcIn .45s cubic-bezier(.34,1.56,.64,1) .15s both}
.srcbtn:hover{background:#fff}
.srcbtn:focus-visible{outline:3px solid var(--red);outline-offset:2px}
@keyframes srcIn{from{transform:translateY(-50%) scale(0)}to{transform:translateY(-50%) scale(1)}}
.autobar{flex:1 1 100%;height:7px;border-radius:99px;background:#E3D5B4;overflow:hidden}
.autobar i{display:block;height:100%;background:var(--good);transform-origin:left;animation:autofill var(--auto,1.8s) linear forwards}
@keyframes autofill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.srcpop{position:absolute;inset:0;z-index:5;background:var(--cream);border-radius:20px;padding:22px;display:grid;align-content:center;gap:12px;
  overflow:auto;animation:scrIn .4s cubic-bezier(.34,1.3,.64,1) both}
.srcpop .lede{max-width:none}
.srcpop .link-btn{justify-self:start}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.fb{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  border-top:3px dashed #D9C79F;padding-top:12px}
.fb p{margin:0;font-size:15px;line-height:1.45;flex:1 1 220px}
.fb strong{display:block;font-family:var(--display);font-weight:400;font-size:20px}
.fb .good{color:var(--good)}.fb .bad{color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.stat{background:var(--paper);border:3px solid var(--navy);border-radius:16px;padding:10px 12px}
.stat span{display:block;font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stat b{font:400 26px/1.1 var(--display);font-variant-numeric:tabular-nums}

/* map bits */
.map-title{font-family:var(--display);font-size:40px;text-anchor:middle;fill:var(--cream);stroke:var(--navy);stroke-width:10px;paint-order:stroke;stroke-linejoin:round}
.fx{transform-box:fill-box;transform-origin:50% 100%}
.ctr{transform-box:fill-box;transform-origin:50% 50%}
.top{transform-box:fill-box;transform-origin:50% 0%}
.place{transition:opacity .6s,filter .6s}
.place.locked{opacity:.5;filter:grayscale(.85)}
.tag text{font-family:var(--display);font-size:22px;text-anchor:middle;fill:var(--navy)}
.tag rect{fill:var(--paper);stroke:var(--navy);stroke-width:4}
.tag{transform:scale(0);transition:transform .6s cubic-bezier(.34,1.56,.64,1)}
.tag.on{transform:none}
.tick{transform:scale(0);transition:transform .5s cubic-bezier(.34,1.8,.64,1) .2s}
.done .tick{transform:none}
.ring{opacity:0}
.ring.on{animation:ring 1.6s ease-out infinite}
@keyframes ring{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.lm.celebrate{animation:celebrate 1s linear}
@keyframes celebrate{0%{transform:none;animation-timing-function:cubic-bezier(0,.55,.45,1)}28%{transform:translateY(-18px) scale(.95,1.06);animation-timing-function:cubic-bezier(.55,0,1,.45)}52%{transform:scale(1.08,.92);animation-timing-function:cubic-bezier(0,.55,.45,1)}72%{transform:translateY(-5px) scale(.99,1.02);animation-timing-function:cubic-bezier(.55,0,1,.45)}88%,100%{transform:none}}
.streak{stroke-dasharray:14 22;animation:fall .5s linear infinite}
@keyframes fall{to{stroke-dashoffset:-36}}
.mist{animation:mist 1.4s ease-in-out infinite}
@keyframes mist{0%,100%{transform:scale(.85)}50%{transform:scale(1.15)}}
.boat{animation:boat 2.4s ease-in-out infinite}
@keyframes boat{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg) translateY(-3px)}75%{transform:rotate(6deg)}}
.hippo{animation:hippo 3.2s ease-in-out infinite}
@keyframes hippo{0%,40%,100%{transform:translateY(8px)}55%,85%{transform:translateY(-4px)}}
.ripple{animation:ripple 2s ease-out infinite}
@keyframes ripple{from{transform:scale(.4);opacity:.9}to{transform:scale(1.4);opacity:0}}
.cloud{animation:cloud 6s ease-in-out infinite}
@keyframes cloud{0%,100%{transform:translateX(-14px)}50%{transform:translateX(14px)}}
.sunrays{animation:whirl 16s linear infinite}
@keyframes whirl{to{transform:rotate(360deg)}}
.flagwave{animation:flagwave 1.6s ease-in-out infinite}
@keyframes flagwave{0%,100%{transform:rotate(0)}50%{transform:rotate(8deg)}}
.trunk{animation:trunk 3s ease-in-out infinite}
@keyframes trunk{0%,100%{transform:rotate(0)}50%{transform:rotate(9deg)}}
.soar{animation:soar 5s ease-in-out infinite}
@keyframes soar{0%,100%{transform:translate(0,0)}50%{transform:translate(26px,-8px)}}
.bloom{animation:bloom 3s ease-in-out infinite}
@keyframes bloom{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.dot{animation:dotIn .4s cubic-bezier(.34,1.8,.64,1) both}
@keyframes dotIn{from{transform:scale(0)}to{transform:none}}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
  .tag{transform:none}
}
</style>

</head>
<body>
<div class="app">
  <header class="hud">
    <p class="brand">Masi's Zim Trivia</p>
    <div class="chip" id="chipScore"><span>Score</span><b id="score">0</b></div>
    <div class="chip"><span>Stop</span><b id="stopNum">–</b></div>
    <div class="chip" aria-label="Lives this stop"><span>Lives</span>
      <div class="lives" id="lives">
        <svg class="life" viewBox="-20 -24 40 44" aria-hidden="true"><ellipse rx="18" ry="16" fill="#E2482F" stroke="#1E3248" stroke-width="2.5"/><path d="M0-14C-6-21-13-19-16-17C-9-14-5-13 0-14C6-20 13-20 16-17C10-14 6-13 0-14" fill="#4E9A3A"/></svg>
        <svg class="life" viewBox="-20 -24 40 44" aria-hidden="true"><ellipse rx="18" ry="16" fill="#E2482F" stroke="#1E3248" stroke-width="2.5"/><path d="M0-14C-6-21-13-19-16-17C-9-14-5-13 0-14C6-20 13-20 16-17C10-14 6-13 0-14" fill="#4E9A3A"/></svg>
      </div>
    </div>
    <div class="chip best"><span>Best</span><b id="best">0</b></div>
    <button class="chip mapbtn" id="mapBtn" type="button" aria-label="Show the map"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4L3 6.5V20l6-2.5 6 2.5 6-2.5V4l-6 2.5z" fill="#F6B531" stroke="#1E3248" stroke-width="2" stroke-linejoin="round"/><path d="M9 4v13.5M15 6.5V20" stroke="#1E3248" stroke-width="2"/></svg><span>Map</span></button>
  </header>

  <main class="main">
    <div class="mapwrap" id="mapwrap"><div class="mapcard"><p class="mapcap" id="mapCap">Your trip</p>
      <svg id="map" viewBox="0 0 800 720" role="img" aria-label="Map of Zimbabwe showing Masi's cycling route">
        <defs>
          <symbol id="star" viewBox="-10 -10 20 20"><path d="M0-10Q1.5-1.5 10 0Q1.5 1.5 0 10Q-1.5 1.5-10 0Q-1.5-1.5 0-10Z" fill="#FFF6D8"/></symbol>
          <radialGradient id="tomG" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#FF7A55"/><stop offset=".55" stop-color="#E2482F"/><stop offset="1" stop-color="#B8301E"/></radialGradient>
        </defs>
        <g transform="translate(730 70)">
          <g class="ctr sunrays" fill="#FFD15C"><path d="M0-54L7-37H-7ZM0 54L7 37H-7ZM-54 0L-37 7V-7ZM54 0L37 7V-7ZM-38-38L-22-30L-30-22ZM38 38L22 30L30 22ZM38-38L30-22L22-30ZM-38 38L-30 22L-22 30Z"/></g>
          <circle r="29" fill="#FFC53D" stroke="#E8A21A" stroke-width="4"/>
        </g>
        <path id="landSide" fill="var(--navy-deep)" stroke="var(--navy-deep)" stroke-width="14" stroke-linejoin="round" transform="translate(0 14)"/>
        <path id="land" fill="#F2E2B0" stroke="var(--navy)" stroke-width="12" stroke-linejoin="round"/>
        <path id="river" fill="none" stroke="#4FA7D6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <path id="lake" fill="#6CC3E8" stroke="#2F7FB0" stroke-width="4" stroke-linejoin="round"/>
        <g id="decor"></g>
        <g id="trail"></g>
        <g id="places"></g>
        <g id="rings"></g>
        <g id="tags"></g>
        <path id="route" fill="none" stroke="none"/>
        <g id="fxLayer"></g>
        <g id="mbike" transform="translate(70 400)"><g id="mflip"><g id="mhop" class="fx">
          <g fill="none" stroke="var(--navy)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
            <g class="ctr mw"><circle cx="-24" cy="-16" r="15"/><path d="M-24-29V-3M-37-16H-11" stroke-width="2.5"/></g>
            <g class="ctr mw"><circle cx="24" cy="-16" r="15"/><path d="M24-29V-3M11-16H37" stroke-width="2.5"/></g>
            <path d="M-24-16L-9-38H12L24-16M-9-38L-2-16H-24M-2-16L12-38M-13-44H-4M12-38L9-50L17-53"/>
          </g>
          <g id="rider" transform="translate(-6 -62)"><g id="face" class="ctr">

        var vel=dt?(cur-before)/dt:0,p=pt(cur),a=pt(cur-12),b=pt(cur+12),ddx=b.x-a.x,ddy=b.y-a.y;
        if(Math.abs(ddx)>1.5)dir=ddx<0?-1:1;
        var target=Math.max(-18,Math.min(18,Math.atan2(ddy,Math.abs(ddx)||.001)*180/Math.PI*dir));
        ang+=(target-ang)*(1-Math.exp(-dt*7));flipS+=(dir-flipS)*(1-Math.exp(-dt*9));
        wheelA+=(cur-before)/15*180/Math.PI;
        pos.x=p.x;pos.y=p.y;drawBike();
        dotAcc+=cur-before;
        if(dotAcc>18){dotAcc=0;var c=document.createElementNS(NS,'circle');c.setAttribute('cx',p.x.toFixed(1));c.setAttribute('cy',(p.y-1).toFixed(1));c.setAttribute('r','3.6');c.setAttribute('fill','#E2482F');c.setAttribute('class','ctr dot');$('trail').appendChild(c)}
        if(vel>70&&now-lastPuff>(vel>180?70:140)){lastPuff=now;
          var d=document.createElementNS(NS,'circle');d.setAttribute('cx',p.x-dir*28);d.setAttribute('cy',p.y-5);d.setAttribute('r',5);d.setAttribute('fill','#fff');$('fxLayer').appendChild(d);
          var an=d.animate([{transform:'translate(0,0) scale(.6)',opacity:.75},{transform:'translate('+(-dir*16)+'px,-12px) scale(1.9)',opacity:0}],{duration:700,easing:'cubic-bezier(.2,.7,.4,1)'});an.onfinish=function(){d.remove()};
        }
        if(x>=1){
          var settle=performance.now();
          (function s(n){var k=Math.min(.05,(n-settle)/1000);settle=n;ang+=(0-ang)*(1-Math.exp(-k*8));drawBike();if(Math.abs(ang)>.3&&token===game.token)requestAnimationFrame(s)})(settle);
          return res();
        }
        requestAnimationFrame(f);
      }
      requestAnimationFrame(f);
    });
  }

  /* ---------- map pop-up (only visible as an overlay on small screens) ---------- */
  var mapTimer=0;
  function openMap(cap,btn){clearTimeout(mapTimer);$('mapCap').textContent=cap||'Your trip so far';$('mapClose').textContent=btn||'Back to the questions';document.body.classList.add('mapOpen')}
  function closeMap(delay){clearTimeout(mapTimer);if(delay){mapTimer=setTimeout(function(){document.body.classList.remove('mapOpen')},delay)}else document.body.classList.remove('mapOpen')}
  $('mapBtn').onclick=function(){openMap(game.phase==='ask'?'Clock\u2019s still ticking!':'Your trip so far')};
  $('mapClose').onclick=function(){closeMap()};
  $('mapwrap').addEventListener('click',function(e){if(e.target===this)closeMap()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeMap()});

  /* ---------- game state ---------- */
  var game={token:0,stop:0,score:0,phase:'start',round:[],qi:0,wrong:0,results:[],streak:0,time:60,cleared:0};
  var best=0; try{best=+localStorage.getItem('zimtrip-best')||0}catch(e){}
  $('best').textContent=best;
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

  function setScore(add){
    var from=game.score;game.score+=add;
    var el=$('score'),t0=performance.now();
    (function step(n){var k=Math.min(1,(n-t0)/500);el.textContent=Math.round(from+(game.score-from)*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(step)})(t0);
    if(add>0){var f=document.createElement('span');f.className='float';f.textContent='+'+add;$('chipScore').appendChild(f);
      var a=f.animate([{transform:'translateY(0)',opacity:1},{transform:'translateY(-26px)',opacity:0}],{duration:900,easing:'cubic-bezier(.2,.7,.4,1)'});a.onfinish=function(){f.remove()}}
  }
  function setLives(){[].forEach.call(document.querySelectorAll('.life'),function(l,i){l.classList.toggle('lost',i<game.wrong)})}
  function setStop(){$('stopNum').textContent=game.phase==='start'?'–':(Math.min(game.stop+1,PLACES.length)+'/'+PLACES.length)}

  function show(html,focusSel){
    panel.innerHTML='<div class="scr">'+html+'</div>';
    var f=focusSel&&panel.querySelector(focusSel); if(f)f.focus({preventScroll:true});
    if(window.innerWidth<900&&panel.getBoundingClientRect().top<0)window.scrollTo({top:0,behavior:reduced?'auto':'smooth'});
  }

  function startScreen(){
    game.phase='start';setStop();
    show('<p class="eyebrow">An ExploreLocally.co.zw trivia ride</p><h1>Masi’s Zim Trivia</h1>'+
      '<p class="lede">Hop on the bike and pedal from Victoria Falls to the Matobo Hills. Each stop has five questions about the place you’ve just ridden into.</p>'+
      '<ul class="rules"><li><i>5</i>questions at every stop</li><li><i>60</i>seconds on the clock per stop</li><li><i>2</i>wrong answers and the trip is over</li></ul>'+
      '<button class="cta" id="go" type="button">Start riding →</button>'+(best?'<p class="small">Your best so far: '+best+' points</p>':''),'#go');
    $('go').onclick=newGame;
  }

  function resetMap(){
    $('trail').innerHTML='';
    PLACES.forEach(function(p,i){$('pl'+i).setAttribute('class','place locked');$('tag'+i).firstChild.classList.remove('on');$('tag'+i).classList.remove('done');$('ring'+i).classList.remove('on')});
  }

  function newGame(){
    closeMap();clearTimeout(autoT);
    game.token++;game.stop=0;game.score=0;game.streak=0;game.cleared=0;game.wrong=0;
    $('score').textContent='0';setLives();mood(false);resetMap();
    pos.x=START[0];pos.y=START[1];dir=1;flipS=1;ang=0;drawBike();
    rideToStop();
  }

  async function rideToStop(){
    var i=game.stop,t=game.token,L=LAYOUT[PLACES[i].id];
    game.phase='ride';setStop();game.wrong=0;setLives();mood(false);
    $('ring'+i).classList.add('on');
    openMap('Pedalling to '+PLACES[i].name+'\u2026','Skip to the questions');
    show('<p class="eyebrow">Stop '+(i+1)+' of '+PLACES.length+'</p><h2>Pedalling to '+esc(PLACES[i].name)+'…</h2><p class="lede">'+esc(PLACES[i].blurb)+'</p>');
    await rideTo(L.stop[0],L.stop[1],t); if(t!==game.token)return;
    arrive(i);
  }

  function arrive(i){
    var pl=$('pl'+i);pl.setAttribute('class','place');
    var lm=pl.querySelector('.lm');lm.classList.remove('celebrate');void lm.getBBox();lm.classList.add('celebrate');
    $('tag'+i).firstChild.classList.add('on');$('ring'+i).classList.remove('on');
    bikeHop();burst(LAYOUT[PLACES[i].id].tag[0],LAYOUT[PLACES[i].id].tag[1]);
    game.phase='ready';
    closeMap(1700);
    show('<p class="eyebrow">Stop '+(i+1)+' of '+PLACES.length+'</p><h2>Welcome to '+esc(PLACES[i].name)+'!</h2><p class="lede">'+esc(PLACES[i].blurb)+'</p>'+
      '<ul class="rules"><li><i>5</i>questions about '+esc(PLACES[i].name)+'</li><li><i>60</i>seconds — the clock starts when you do</li><li><i>4</i>right answers to ride on</li></ul>'+
      '<button class="cta" id="begin" type="button">Start the clock</button>','#begin');
    $('begin').onclick=beginRound;
  }

  // question rotation: prefer questions this player hasn't seen yet, then start a fresh cycle
  var seenMem={};
  function loadSeen(){try{return JSON.parse(localStorage.getItem('zimtrip-seen'))||seenMem}catch(e){return seenMem}}
  function saveSeen(v){seenMem=v;try{localStorage.setItem('zimtrip-seen',JSON.stringify(v))}catch(e){}}
  function pickQuestions(pl){
    var all=pl.qs.map(function(_,i){return i}),seenAll=loadSeen(),seen=seenAll[pl.id]||[];
    var unseen=shuffle(all.filter(function(i){return seen.indexOf(i)<0}));
    var chosen,next;
    if(unseen.length>=5){chosen=unseen.slice(0,5);next=seen.concat(chosen)}
    else{chosen=unseen.concat(shuffle(seen).slice(0,5-unseen.length));next=chosen.slice()}
    seenAll[pl.id]=next;saveSeen(seenAll);
    return chosen.map(function(i){return pl.qs[i]});
  }
  function beginRound(){
    var pl=PLACES[game.stop];
    game.round=pickQuestions(pl).map(function(q){var o=shuffle(q.o);return{q:q.q,o:o,a:o.indexOf(q.o[0]),f:q.f,s:q.s||pl.src}});
    game.qi=0;game.wrong=0;game.results=[];game.time=60;setLives();
    askQuestion();tickStart();
  }

  var tickRAF=0,lastTick=0;
  function tickStart(){cancelAnimationFrame(tickRAF);lastTick=performance.now();tickRAF=requestAnimationFrame(tick)}
  function tick(now){
    var dt=(now-lastTick)/1000;lastTick=now;
    if(game.phase==='ask'){
      game.time=Math.max(0,game.time-dt);paintClock();
      if(game.time<=0){timeUp();return}
    }
    if(game.phase==='ask'||game.phase==='feedback')tickRAF=requestAnimationFrame(tick);
  }
  function paintClock(){
    var c=$('clock'),b=$('barFill'),bar=$('bar');if(!c)return;
    var s=Math.ceil(game.time);c.textContent=Math.floor(s/60)+':'+(s%60<10?'0':'')+(s%60);
    b.style.transform='scaleX('+(game.time/60).toFixed(4)+')';
    var hot=game.time<=10;c.classList.toggle('hot',hot);bar.classList.toggle('hot',hot);
  }
  function pips(){
    var h='';for(var k=0;k<5;k++){var r=game.results[k];h+='<span class="pip'+(r===true?' ok':r===false?' no':k===game.qi?' now':'')+'"></span>'}return h;
  }

  function askQuestion(){
    var pl=PLACES[game.stop],q=game.round[game.qi];
    game.phase='ask';
    show('<div class="qtop"><p class="eyebrow">'+esc(pl.name)+' · Q'+(game.qi+1)+' of 5</p><span class="clock" id="clock">1:00</span></div>'+
      '<div class="bar" id="bar"><i id="barFill"></i></div>'+
      '<div class="pips" aria-hidden="true">'+pips()+'</div>'+
      '<p class="question">'+esc(q.q)+'</p>'+
      '<div class="opts">'+q.o.map(function(o,k){return '<div class="optrow"><button class="opt" type="button" data-k="'+k+'"><span class="k">'+'ABCD'[k]+'</span><span>'+esc(o)+'</span></button></div>'}).join('')+'</div>'+
      '<div id="fbSlot"></div>');
    paintClock();
    [].forEach.call(panel.querySelectorAll('.opt'),function(b){b.onclick=function(){choose(+b.dataset.k)}});
  }

  var autoT=0;
  function choose(k){
    if(game.phase!=='ask')return;
    game.phase='feedback';
    var q=game.round[game.qi],ok=k===q.a,btns=panel.querySelectorAll('.opt'),tok=game.token;
    [].forEach.call(btns,function(b,n){b.disabled=true;if(n===q.a)b.classList.add('right');else if(n===k)b.classList.add('wrong');else b.classList.add('dim')});
    game.results[game.qi]=ok;
    var pts=0;
    if(ok){pts=100+game.streak*20;game.streak++;setScore(pts);bikeHop()}
    else{game.wrong++;game.streak=0;setLives();bikeShake()}
    var out=game.wrong>=2,last=game.qi===4;
    var label=out?'See your result':last?'Finish the stop':'Next question';
    function advance(){
      clearTimeout(autoT);
      if(tok!==game.token||game.phase!=='feedback')return;
      if(out)return gameOver('wrong');
      if(last)return stopCleared();
      game.qi++;askQuestion();
    }
    // "Source" chip on the correct answer
    var row=panel.querySelectorAll('.optrow')[q.a];row.classList.add('hasSrc');
    var sb=document.createElement('button');sb.type='button';sb.className='srcbtn';sb.textContent='Source';
    sb.setAttribute('aria-label','Check the source for this answer');row.appendChild(sb);
    if(ok){
      var wait=reduced?2400:1900;
      $('fbSlot').innerHTML='<div class="fb" style="--auto:'+wait+'ms"><p><strong class="good">Spot on! +'+pts+'</strong>'+(last?'Stop complete!':'Next question coming up\u2026')+'</p><div class="autobar"><i></i></div></div>';
      autoT=setTimeout(advance,wait);
    }else{
      $('fbSlot').innerHTML='<div class="fb"><p><strong class="bad">'+(out?'That\u2019s two wrong\u2026':'Not quite \u2014 one life left')+'</strong>'+
        'The answer is <b>'+esc(q.o[q.a])+'</b>. '+esc(q.f)+'</p><button class="cta" id="next" type="button">'+label+'</button></div>';
      var n=$('next');n.focus({preventScroll:true});n.onclick=advance;
    }
    panel.querySelector('.pips').innerHTML=pips();
    sb.onclick=function(){clearTimeout(autoT);openSource(q,ok?advance:null,label)};
  }

  function openSource(q,cont,label){
    var old=panel.querySelector('.srcpop');if(old)old.remove();
    var d=document.createElement('div');d.className='srcpop';d.setAttribute('role','dialog');d.setAttribute('aria-label','Fact check');
    var title=decodeURIComponent(q.s.split('/wiki/')[1]||'').replace(/_/g,' ');
    d.innerHTML='<p class="eyebrow">Fact check</p><p class="question">'+esc(q.q)+'</p>'+
      '<p class="lede"><b>Answer: '+esc(q.o[q.a])+'</b><br>'+esc(q.f)+'</p>'+
      '<a class="link-btn" href="'+esc(q.s)+'" target="_blank" rel="noopener">Read \u201c'+esc(title)+'\u201d on Wikipedia \u2197</a>'+
      '<button class="cta" id="srcGo" type="button">'+(cont?esc(label):'Back')+'</button>';
    panel.appendChild(d);
    var g=$('srcGo');g.focus({preventScroll:true});
    g.onclick=function(){d.remove();if(cont)cont();else{var n=$('next');if(n)n.focus({preventScroll:true})}};
  }

  function timeUp(){
    game.phase='over';
    [].forEach.call(panel.querySelectorAll('.opt'),function(b){b.disabled=true});
    gameOver('time');
  }

  function stopCleared(){
    game.phase='cleared';cancelAnimationFrame(tickRAF);
    var i=game.stop,right=game.results.filter(Boolean).length,secs=Math.ceil(game.time);
    var timeBonus=secs*5,perfect=right===5?250:0;
    setScore(timeBonus+perfect);game.cleared=i+1;
    $('tag'+i).classList.add('done');
    var lastStop=i===PLACES.length-1;
    if(lastStop)return win();
    var next=PLACES[i+1];
    show('<p class="eyebrow">Stop '+(i+1)+' cleared</p><h2>'+esc(PLACES[i].name)+' ✓</h2>'+
      '<div class="stats"><div class="stat"><span>Correct</span><b>'+right+'/5</b></div><div class="stat"><span>Time bonus</span><b>+'+timeBonus+'</b></div>'+(perfect?'<div class="stat"><span>Perfect stop</span><b>+250</b></div>':'')+'</div>'+
      '<p class="lede">Next up: <b>'+esc(next.name)+'</b>. Lives refill at every stop.</p>'+
      '<button class="cta" id="ride" type="button">Ride to '+esc(next.name)+' →</button>'+exploreBtn(PLACES[i]),'#ride');
    $('ride').onclick=function(){game.stop++;rideToStop()};
  }

  var SITE='https://explorelocally.co.zw', GAME_URL='https://zimtrivia.explorelocally.co.zw';
  function siteLink(pl){return SITE+pl.link+'?utm_source=zimtrip&utm_medium=game&utm_campaign=tomato_trivia'}
  function exploreBtn(pl,lead){return '<a class="link-btn explore" href="'+siteLink(pl)+'" target="_blank" rel="noopener">'+(lead||'')+esc(pl.linkLabel)+' on ExploreLocally \u2197</a>'}
  var WA='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 0 0-7.8 13.5L3 21l4.6-1.2A9 9 0 1 0 12 3z" fill="#25D366" stroke="#1E3248" stroke-width="1.6"/><path d="M8.6 8.2c.2-.4.5-.4.8-.4h.5c.2 0 .4.1.5.4l.7 1.6c.1.2 0 .4-.1.6l-.5.6c.4.9 1.3 1.8 2.3 2.3l.6-.6c.2-.2.4-.2.6-.1l1.6.7c.3.1.4.3.4.5v.5c0 .3 0 .6-.4.8-.5.3-1.4.6-2.6.2-2.2-.8-3.9-2.5-4.7-4.7-.3-1.1 0-2 .3-2.4z" fill="#fff"/></svg>';
  function shareBlock(text){
    return '<div class="actions"><a class="link-btn wa" href="https://wa.me/?text='+encodeURIComponent(text)+'" target="_blank" rel="noopener">'+WA+'Share on WhatsApp</a>'+
      '<button class="link-btn" id="copyBtn" type="button">Copy my score</button></div><textarea class="sharetext" id="shareText" readonly hidden aria-label="Your score message">'+esc(text)+'</textarea>';
  }
  function wireCopy(text){
    var b=$('copyBtn');if(!b)return;
    b.onclick=function(){
      function fallback(){var t=$('shareText');t.hidden=false;t.focus();t.select();b.textContent='Select and copy the text below'}
      try{navigator.clipboard.writeText(text).then(function(){b.textContent='Copied!'},fallback)}catch(e){fallback()}
    };
  }
  function fmt(n){return n.toLocaleString('en-GB')}

  function saveBest(){var nb=game.score>best;if(nb){best=game.score;$('best').textContent=best;try{localStorage.setItem('zimtrip-best',best)}catch(e){}}return nb}

  function gameOver(why){
    game.phase='over';cancelAnimationFrame(tickRAF);closeMap();mood(true);bikeShake();
    var nb=saveBest(),pl=PLACES[game.stop];
    var msg='I made it to '+pl.name+' on Masi\u2019s Zim Trivia and scored '+fmt(game.score)+' points \ud83c\udf45\ud83d\udeb2 Think you know Zimbabwe better? '+GAME_URL;
    show('<p class="eyebrow">Game over</p><h2>'+(why==='time'?'Out of time at '+esc(pl.name):'Two wrong at '+esc(pl.name))+'</h2>'+
      '<p class="lede">'+(why==='time'?'The clock ran out before all five questions were answered.':'Masi needs four right answers to keep riding.')+'</p>'+
      '<div class="stats"><div class="stat"><span>Score</span><b>'+game.score+'</b></div><div class="stat"><span>Stops cleared</span><b>'+game.cleared+'/'+PLACES.length+'</b></div><div class="stat"><span>Best</span><b>'+best+'</b></div></div>'+
      (nb&&game.score>0?'<p class="small">New personal best!</p>':'')+
      '<button class="cta" id="again" type="button">Ride again</button>'+shareBlock(msg)+exploreBtn(pl,'Plan a real trip \u00b7 '),'#again');
    $('again').onclick=newGame;wireCopy(msg);
  }

  function win(){
    game.phase='won';var nb=saveBest();bikeHop();
    var msg='I cycled all 10 stops of Masi\u2019s Zim Trivia and scored '+fmt(game.score)+' points \ud83c\udf45\ud83d\udeb2 Can you beat me? '+GAME_URL;
    openMap('Trip complete!','See your score');
    PLACES.forEach(function(p,i){var L=LAYOUT[p.id];setTimeout(function(){burst(L.tag[0],L.tag[1])},i*160)});
    show('<p class="eyebrow">Trip complete</p><h2>You toured all of Zimbabwe!</h2>'+
      '<p class="lede">Ten stops, from the smoke that thunders to the bald heads of Matobo. Masi is very proud of you.</p>'+
      '<div class="stats"><div class="stat"><span>Final score</span><b>'+game.score+'</b></div><div class="stat"><span>Best</span><b>'+best+'</b></div></div>'+
      (nb?'<p class="small">New personal best!</p>':'')+
      '<button class="cta" id="again" type="button">Ride again</button>'+shareBlock(msg),'#again');
    $('again').onclick=newGame;wireCopy(msg);
  }

  document.addEventListener('keydown',function(e){
    if(game.phase!=='ask'||e.metaKey||e.ctrlKey||e.altKey)return;
    var k='abcd'.indexOf(e.key.toLowerCase()); if(k<0)k='1234'.indexOf(e.key);
    if(k>=0){e.preventDefault();choose(k)}
  });

  startScreen();
})();
</script>
</body>
